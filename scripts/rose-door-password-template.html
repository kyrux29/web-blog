<!doctype html>
<html class="rose-gate-html" lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#12070f" />
    <title>/*[|template_title|]*/0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --night: #0d090b;
        --night-raised: #191014;
        --rose: #d42a46;
        --rose-light: #f2777f;
        --moon: #d3dae3;
        --ink: #f7f0ee;
        --ink-soft: #c5b7b8;
        --line: rgba(247, 240, 238, 0.18);
        --display: "Bricolage Grotesque", sans-serif;
        --body: "IBM Plex Sans", system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      html { background: var(--night); }
      body { min-width: 320px; min-height: 100svh; margin: 0; overflow-x: hidden; background: radial-gradient(circle at 50% 28%, #3b111c 0, var(--night) 48%); color: var(--ink); font-family: var(--body); -webkit-font-smoothing: antialiased; }
      button, input { font: inherit; }
      button { -webkit-tap-highlight-color: transparent; }
      .hidden { display: none !important; }
      .rose-gate-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
      .rose-gate-loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--night); }
      .rose-gate-loading::before { content: ""; width: 2.5rem; aspect-ratio: 1; border: 1px solid var(--line); border-top-color: var(--rose-light); border-radius: 50%; animation: spin 650ms linear infinite; }
      .rose-gate { position: relative; display: grid; min-height: 100svh; place-items: center; padding: clamp(1rem, 4vw, 3rem); isolation: isolate; }
      .rose-gate::before { content: ""; position: fixed; z-index: -2; inset: 0; opacity: 0.24; background-image: radial-gradient(circle, rgba(255, 245, 224, 0.72) 0 1px, transparent 1.25px); background-size: 29px 29px; mask-image: linear-gradient(to bottom, #000, transparent 72%); }
      .rose-gate::after { content: ""; position: fixed; z-index: -1; bottom: -17vw; left: 50%; width: min(72vw, 42rem); aspect-ratio: 1; border: 1px solid rgba(211, 218, 227, 0.13); border-radius: 50%; box-shadow: 0 0 0 1.5rem rgba(211, 218, 227, 0.025), 0 0 7rem rgba(212, 42, 70, 0.17); transform: translateX(-50%); }
      .rose-gate-shell { display: grid; width: min(100%, 66rem); grid-template-columns: minmax(18rem, 0.88fr) minmax(22rem, 1.12fr); overflow: hidden; border: 1px solid var(--line); background: rgba(25, 16, 20, 0.84); box-shadow: 1rem 1rem 0 rgba(102, 19, 38, 0.28); backdrop-filter: blur(14px); }
      .rose-gate-art { position: relative; display: grid; min-height: 39rem; place-items: center; overflow: hidden; border-right: 1px solid var(--line); background: linear-gradient(140deg, rgba(102, 19, 38, 0.68), transparent 54%), #170c11; }
      .rose-gate-art::before { content: ""; position: absolute; top: 9%; left: 50%; width: 17rem; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 36% 35%, #eef0f3 0 6%, #d3dae3 42%, #85828b 72%, #3d3741 100%); box-shadow: 0 0 4rem rgba(211, 218, 227, 0.16); transform: translateX(-50%); opacity: 0.8; }
      .rose-gate-stamp { position: absolute; top: 1.4rem; left: 1.4rem; margin: 0; color: #f1cea1; font-family: var(--mono); font-size: 0.64rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
      .rose-gate-door { position: relative; z-index: 1; width: min(58%, 14rem); aspect-ratio: 0.68; margin-top: 5rem; border: 0.58rem solid #070506; border-bottom-width: 0.65rem; border-radius: 9rem 9rem 0 0; background: linear-gradient(90deg, #651126, #1c070d 47%, #531021); box-shadow: 0 1.2rem 2.4rem rgba(0,0,0,.46), inset 0 0 0 1px rgba(247, 240, 238, 0.18); }
      .rose-gate-door::before, .rose-gate-door::after { content: ""; position: absolute; top: 0.55rem; bottom: 0.55rem; width: 50%; border: 1px solid rgba(255, 221, 184, 0.17); background: repeating-linear-gradient(90deg, rgba(255,255,255,.032) 0 2px, transparent 2px 12px); }
      .rose-gate-door::before { left: 0; border-radius: 7.8rem 0 0 0; border-right: 0; } .rose-gate-door::after { right: 0; border-radius: 0 7.8rem 0 0; border-left: 0; }
      .rose-gate-door span { position: absolute; z-index: 2; top: 44%; left: 50%; display: grid; width: 3rem; aspect-ratio: 1; place-items: center; border: 1px solid var(--moon); border-radius: 50%; background: var(--rose); color: #15090c; font-family: var(--display); font-size: 1.45rem; font-weight: 800; transform: translate(-50%, -50%); box-shadow: 0 0 0 0.32rem rgba(38, 7, 14, 0.74); }
      .rose-gate-bats { position: absolute; z-index: 3; top: 25%; left: 50%; width: 17rem; height: 9rem; transform: translateX(-50%); pointer-events: none; }
      .rose-gate-bats svg { position: absolute; width: 2.2rem; fill: #110b1a; filter: drop-shadow(0 .3rem .25rem rgba(0,0,0,.35)); animation: bat-drift 2.4s ease-in-out infinite alternate; }
      .rose-gate-bats svg:nth-child(1) { top: 19%; left: 3%; transform: rotate(-11deg); animation-delay: -1.1s; } .rose-gate-bats svg:nth-child(2) { top: 0; left: 43%; width: 1.65rem; animation-delay: -.5s; } .rose-gate-bats svg:nth-child(3) { top: 32%; right: 4%; width: 2.55rem; transform: rotate(8deg); animation-delay: -1.7s; }
      .rose-gate-panel { display: flex; flex-direction: column; justify-content: center; padding: clamp(2rem, 6vw, 5.5rem); }
      .rose-gate-brand { margin: 0; color: var(--rose-light); font-family: var(--mono); font-size: .67rem; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; }
      .rose-gate-title { max-width: 28rem; margin: 1.1rem 0 0; color: var(--ink); font-family: var(--display); font-size: clamp(3.1rem, 6vw, 5.5rem); font-weight: 800; letter-spacing: -.075em; word-spacing: .08em; line-height: .82; }
      .rose-gate-title em { color: var(--rose-light); font-style: normal; }
      .rose-gate-instructions { max-width: 26rem; margin: 1.35rem 0 0; color: var(--ink-soft); font-size: .95rem; line-height: 1.7; }
      .rose-gate-hint { display: inline-flex; width: max-content; margin-top: 1.2rem; padding: .48rem .62rem; border: 1px solid rgba(242, 119, 127, .55); color: #f2777f; font-family: var(--mono); font-size: .67rem; letter-spacing: .08em; }
      .rose-gate-form { display: grid; gap: .85rem; max-width: 26rem; margin-top: 2.3rem; }
      .rose-gate-label { color: rgba(255, 246, 233, .72); font-family: var(--mono); font-size: .67rem; font-weight: 600; letter-spacing: .11em; text-transform: uppercase; }
      .rose-gate-field { display: grid; grid-template-columns: 1fr auto; overflow: hidden; border: 1px solid var(--line); background: rgba(10, 7, 16, .33); transition: border-color 180ms ease, box-shadow 180ms ease; }
      .rose-gate-field:focus-within { border-color: #f1c487; box-shadow: 0 0 0 3px rgba(241, 196, 135, .12); }
      .rose-gate-field input { width: 100%; min-width: 0; padding: .9rem 1rem; border: 0; outline: 0; background: transparent; color: var(--ink); font-family: var(--mono); letter-spacing: .1em; } .rose-gate-field input::placeholder { color: rgba(255, 246, 233, .42); letter-spacing: 0; }
      .rose-gate-toggle { padding: 0 .9rem; border: 0; border-left: 1px solid var(--line); background: transparent; color: #eec595; font-family: var(--mono); font-size: .64rem; font-weight: 600; cursor: pointer; }
      .rose-gate-submit { padding: .95rem 1rem; border: 1px solid var(--rose); background: var(--rose); color: #fffaf6; font-family: var(--mono); font-size: .7rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease; }
      .rose-gate-submit:hover, .rose-gate-submit:focus-visible { transform: translate(-.2rem, -.2rem); box-shadow: .2rem .2rem 0 var(--rose-light); } .rose-gate-submit:disabled { cursor: wait; opacity: .76; transform: none; box-shadow: none; }
      .rose-gate-status { min-height: 1.4rem; margin: 0; color: #f2c0c4; font-size: .78rem; line-height: 1.45; } .rose-gate-form.has-error .rose-gate-field { border-color: #db7085; }
      .rose-gate-back { width: max-content; margin-top: 2.2rem; color: rgba(255, 246, 233, .66); font-family: var(--mono); font-size: .67rem; letter-spacing: .05em; text-decoration: none; border-bottom: 1px solid rgba(255, 246, 233, .42); }
      .rose-gate-toggle:focus-visible, .rose-gate-back:focus-visible { outline: 3px solid #f1c487; outline-offset: 3px; }
      @keyframes spin { to { transform: rotate(1turn); } } @keyframes bat-drift { to { translate: 0 -.5rem; scale: .91; } }
      @media (max-width: 720px) { .rose-gate { padding: 0; } .rose-gate-shell { min-height: 100svh; grid-template-columns: 1fr; border: 0; box-shadow: none; } .rose-gate-art { min-height: 19rem; border-right: 0; border-bottom: 1px solid var(--line); } .rose-gate-door { width: 8.4rem; margin-top: 3rem; } .rose-gate-bats { top: 17%; } .rose-gate-panel { padding: 2.3rem 1.5rem 3rem; justify-content: start; } .rose-gate-title { font-size: 3.6rem; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <div id="staticrypt_loading" class="rose-gate-loading" role="status"><span class="rose-gate-sr">Đang tải cánh cửa…</span></div>
    <main id="staticrypt_content" class="rose-gate hidden">
      <section class="rose-gate-shell" aria-labelledby="rose-gate-title">
        <div class="rose-gate-art" aria-hidden="true">
          <p class="rose-gate-stamp">Kyrux · private route</p>
          <div class="rose-gate-bats">
            <svg viewBox="0 0 64 32"><path d="M32 14C27 8 21 5 13 5c3 3 4 6 3 10-4-3-8-3-12-1 5 3 8 7 10 13 6-2 11-5 18-9 7 4 12 7 18 9 2-6 5-10 10-13-4-2-8-2-12 1-1-4 0-7 3-10-8 0-14 3-19 9Z"/></svg>
            <svg viewBox="0 0 64 32"><path d="M32 14C27 8 21 5 13 5c3 3 4 6 3 10-4-3-8-3-12-1 5 3 8 7 10 13 6-2 11-5 18-9 7 4 12 7 18 9 2-6 5-10 10-13-4-2-8-2-12 1-1-4 0-7 3-10-8 0-14 3-19 9Z"/></svg>
            <svg viewBox="0 0 64 32"><path d="M32 14C27 8 21 5 13 5c3 3 4 6 3 10-4-3-8-3-12-1 5 3 8 7 10 13 6-2 11-5 18-9 7 4 12 7 18 9 2-6 5-10 10-13-4-2-8-2-12 1-1-4 0-7 3-10-8 0-14 3-19 9Z"/></svg>
          </div>
          <div class="rose-gate-door"><span>R</span></div>
        </div>
        <div class="rose-gate-panel">
          <p class="rose-gate-brand">Rose Door</p>
          <h1 id="rose-gate-title" class="rose-gate-title">/*[|template_title|]*/0</h1>
          <p class="rose-gate-instructions">/*[|template_instructions|]*/0</p>
          <span class="rose-gate-hint">hint · my birthday</span>
          <form id="staticrypt-form" class="rose-gate-form" novalidate>
            <label class="rose-gate-label" for="staticrypt-password">Mật mã</label>
            <div class="rose-gate-field">
              <input id="staticrypt-password" name="rose-door-password" type="password" inputmode="numeric" autocomplete="current-password" spellcheck="false" placeholder="/*[|template_placeholder|]*/0" aria-describedby="staticrypt-status" required />
              <button id="staticrypt-toggle" class="rose-gate-toggle staticrypt-toggle-password-visibility" type="button">Hiện</button>
            </div>
            <label id="staticrypt-remember-label" class="hidden"><input id="staticrypt-remember" type="checkbox" />/*[|template_remember|]*/0</label>
            <p id="staticrypt-status" class="rose-gate-status" role="alert" aria-live="polite"></p>
            <button class="rose-gate-submit staticrypt-decrypt-button" type="submit">/*[|template_button|]*/0</button>
          </form>
          <a class="rose-gate-back" href="/">← Về Kyrux Blog</a>
        </div>
      </section>
    </main>

    <script>
      const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
      const templateError = "/*[|template_error|]*/0";
      const templateToggleAltShow = "/*[|template_toggle_show|]*/0";
      const templateToggleAltHide = "/*[|template_toggle_hide|]*/0";
      const isRememberEnabled = /*[|is_remember_enabled|]*/ 0;
      const staticryptConfig = /*[|staticrypt_config|]*/ 0;
      const staticrypt = staticryptInitiator.init(staticryptConfig, {
        rememberExpirationKey: "rose_door_expiration",
        rememberPassphraseKey: "rose_door_passphrase",
        replaceHtmlCallback: null,
        clearLocalStorageCallback: null
      });
      const loading = document.getElementById("staticrypt_loading");
      const content = document.getElementById("staticrypt_content");
      const form = document.getElementById("staticrypt-form");
      const input = document.getElementById("staticrypt-password");
      const remember = document.getElementById("staticrypt-remember");
      const rememberLabel = document.getElementById("staticrypt-remember-label");
      const toggle = document.getElementById("staticrypt-toggle");
      const status = document.getElementById("staticrypt-status");
      const decryptButton = document.querySelector(".staticrypt-decrypt-button");
      const defaultButtonText = decryptButton.textContent;
      const secureContextError = "Cánh cửa chỉ mở trên HTTPS hoặc http://localhost.";

      function canUseWebCrypto() { return Boolean(window.isSecureContext && window.crypto && window.crypto.subtle); }
      function revealGate() { loading.classList.add("hidden"); content.classList.remove("hidden"); if (isRememberEnabled) rememberLabel.classList.remove("hidden"); }
      function resetButton() { decryptButton.disabled = false; decryptButton.textContent = defaultButtonText; }
      function showFailure(message) { form.classList.add("has-error"); input.setAttribute("aria-invalid", "true"); status.textContent = message; resetButton(); }

      window.onload = async function () {
        if (!canUseWebCrypto()) { revealGate(); showFailure(secureContextError); return; }
        try {
          const result = await staticrypt.handleDecryptOnLoad();
          if (result.isSuccessful) return;
          revealGate();
          if (window.matchMedia("(pointer: fine) and (min-width: 721px)").matches) input.focus();
        } catch (_) {
          revealGate();
          showFailure("Không thể khởi tạo cánh cửa. Hãy tải lại trang và thử lại.");
        }
      };

      toggle.setAttribute("aria-label", templateToggleAltShow);
      toggle.addEventListener("click", function () {
        const showing = input.type === "text";
        input.type = showing ? "password" : "text";
        toggle.textContent = showing ? "Hiện" : "Ẩn";
        toggle.setAttribute("aria-label", showing ? templateToggleAltShow : templateToggleAltHide);
        input.focus();
      });
      input.addEventListener("input", function () { if (!canUseWebCrypto()) { showFailure(secureContextError); return; } form.classList.remove("has-error"); input.removeAttribute("aria-invalid"); status.textContent = ""; });
      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (!canUseWebCrypto()) { showFailure(secureContextError); return; }
        if (!input.value) { showFailure("Hãy nhập mật mã trước khi gõ cửa."); input.focus(); return; }
        form.classList.remove("has-error"); status.textContent = "Cánh cửa đang lắng nghe…"; decryptButton.disabled = true; decryptButton.textContent = "ĐANG MỞ…";
        try {
          const result = await staticrypt.handleDecryptionOfPage(input.value, remember.checked);
          if (!result.isSuccessful) { showFailure(templateError); input.select(); }
        } catch (_) { showFailure(canUseWebCrypto() ? "Cánh cửa không mở được. Hãy tải lại trang và thử lại." : secureContextError); }
      });
    </script>
  </body>
</html>
