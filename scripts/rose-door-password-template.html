<!doctype html>
<html class="rose-gate-html" lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08050d" />
    <title>/*[|template_title|]*/0</title>
    <style>
      :root {
        --night: #08050d;
        --plum: #190b1a;
        --wine: #4e1022;
        --rose: #c82a45;
        --rose-light: #ef7180;
        --moon: #dbe5f4;
        --bone: #f3e6d2;
        --line: rgba(235, 230, 240, 0.16);
        --ios: ui-rounded, "SF Pro Rounded", "SF Pro Display", -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      html {
        background: var(--night);
      }

      body {
        min-width: 320px;
        min-height: 100svh;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 24%, rgba(128, 33, 58, 0.3), transparent 31rem),
          radial-gradient(ellipse at 50% 100%, rgba(41, 12, 31, 0.72), transparent 38rem),
          var(--night);
        color: var(--moon);
        font-family: var(--ios);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      button,
      input {
        font: inherit;
      }

      button {
        -webkit-tap-highlight-color: transparent;
      }

      .hidden {
        display: none !important;
      }

      .rose-gate-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .rose-gate-loading {
        position: fixed;
        z-index: 20;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--night);
      }

      .rose-gate-loading::before {
        width: 2.45rem;
        height: 3.2rem;
        border: 1px solid rgba(219, 229, 244, 0.32);
        border-bottom: 0;
        border-radius: 3rem 3rem 0 0;
        box-shadow:
          0 0 0 0.32rem rgba(200, 42, 69, 0.06),
          0 0 2.2rem rgba(200, 42, 69, 0.25);
        content: "";
        animation: loading-door 1.2s ease-in-out infinite alternate;
      }

      .rose-gate {
        position: relative;
        display: grid;
        min-height: 100svh;
        place-items: center;
        isolation: isolate;
      }

      .rose-gate::before {
        position: fixed;
        z-index: -3;
        inset: 0;
        background-image: radial-gradient(rgba(233, 235, 248, 0.5) 0.65px, transparent 0.8px);
        background-position: 0 0;
        background-size: 31px 31px;
        content: "";
        mask-image: radial-gradient(ellipse at 50% 19%, #000, transparent 58%);
        opacity: 0.26;
      }

      .rose-gate::after {
        position: fixed;
        z-index: -2;
        top: -19rem;
        left: 50%;
        width: min(95vw, 48rem);
        aspect-ratio: 1;
        border: 1px solid rgba(219, 229, 244, 0.13);
        border-radius: 50%;
        box-shadow:
          0 0 0 1.6rem rgba(219, 229, 244, 0.02),
          0 0 7rem rgba(200, 42, 69, 0.14);
        content: "";
        transform: translateX(-50%);
      }

      .rose-gate-shell {
        position: relative;
        display: grid;
        width: min(100%, 34rem);
        min-height: 100svh;
        align-content: center;
        justify-items: center;
        padding: clamp(1.5rem, 5vh, 3.2rem) 1.25rem clamp(1.8rem, 5vh, 3rem);
      }

      .rose-gate-scene {
        position: absolute;
        z-index: -1;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .rose-gate-moon {
        position: absolute;
        top: clamp(2.5rem, 7vh, 5.5rem);
        left: 50%;
        width: clamp(13.5rem, 48vw, 19.5rem);
        aspect-ratio: 1;
        border-radius: 50%;
        background:
          radial-gradient(circle at 34% 31%, rgba(255, 255, 255, 0.96) 0 4%, transparent 4.5%),
          radial-gradient(circle at 63% 62%, rgba(110, 114, 139, 0.42) 0 8%, transparent 8.5%),
          radial-gradient(circle at 32% 63%, rgba(110, 114, 139, 0.32) 0 12%, transparent 12.5%),
          radial-gradient(circle at 47% 44%, #f5f5f4, #cad3e1 63%, #7c7389 100%);
        box-shadow:
          0 0 0 1px rgba(235, 242, 252, 0.18),
          0 0 5rem rgba(203, 216, 242, 0.12);
        opacity: 0.48;
        transform: translateX(-50%);
      }

      .rose-gate-moon::after {
        position: absolute;
        inset: -12%;
        border: 1px solid rgba(233, 215, 184, 0.2);
        border-radius: inherit;
        box-shadow: 0 0 0 1.25rem rgba(200, 42, 69, 0.025);
        content: "";
      }

      .rose-gate-door {
        position: absolute;
        top: clamp(4.8rem, 13vh, 8.4rem);
        left: 50%;
        width: clamp(7.7rem, 30vw, 10.5rem);
        aspect-ratio: 0.64;
        border: clamp(0.38rem, 1.1vw, 0.58rem) solid #050407;
        border-bottom-width: clamp(0.5rem, 1.3vw, 0.68rem);
        border-radius: 8rem 8rem 0 0;
        background: #19060e;
        box-shadow:
          0 1.2rem 2.8rem rgba(0, 0, 0, 0.5),
          inset 0 0 0 1px rgba(248, 229, 208, 0.12);
        transform: translateX(-50%);
      }

      .rose-gate-door::before,
      .rose-gate-door::after {
        position: absolute;
        top: 0.38rem;
        bottom: 0.38rem;
        width: 50.15%;
        border: 1px solid rgba(248, 227, 205, 0.12);
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.06), transparent 16%, transparent 77%, rgba(0, 0, 0, 0.3)),
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 10px),
          linear-gradient(145deg, #641126, #1b060d 67%, #0b0509);
        content: "";
        transition: transform 800ms cubic-bezier(0.16, 1, 0.3, 1), filter 700ms ease;
        will-change: transform;
      }

      .rose-gate-door::before {
        left: 0;
        border-right: 0;
        border-radius: 7.2rem 0 0 0;
        transform-origin: left center;
      }

      .rose-gate-door::after {
        right: 0;
        border-left: 0;
        border-radius: 0 7.2rem 0 0;
        transform-origin: right center;
      }

      .rose-gate-door i {
        position: absolute;
        z-index: 2;
        top: 54%;
        left: 50%;
        width: 0.52rem;
        aspect-ratio: 1;
        border: 1px solid #f0c98a;
        border-radius: 50%;
        background: var(--rose);
        box-shadow: 0 0 0 0.2rem rgba(24, 6, 13, 0.78);
        transform: translate(-50%, -50%);
        transition: opacity 220ms ease;
      }

      .rose-gate-door b {
        position: absolute;
        z-index: 0;
        top: 16%;
        bottom: 5%;
        left: 50%;
        width: 3px;
        border-radius: 999px;
        background: linear-gradient(180deg, transparent, rgba(239, 113, 128, 0.6), transparent);
        box-shadow: 0 0 1.5rem rgba(200, 42, 69, 0.52);
        opacity: 0.4;
        transform: translateX(-50%);
      }

      .rose-gate-dust,
      .rose-gate-dust i {
        position: absolute;
      }

      .rose-gate-dust {
        inset: 0;
      }

      .rose-gate-dust i {
        top: var(--y);
        left: var(--x);
        width: var(--s);
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--c);
        box-shadow: 0 0 0.7rem var(--c);
        opacity: 0;
        animation: star-breathe var(--d) ease-in-out var(--delay) infinite alternate;
      }

      .rose-pin-form {
        position: relative;
        display: grid;
        width: min(100%, 18.8rem);
        justify-items: center;
        margin-top: clamp(18rem, 39vh, 23.5rem);
      }

      .rose-pin-input {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        border: 0;
        margin: 0;
        outline: 0;
        opacity: 0;
      }

      .rose-pin-dots {
        display: flex;
        min-height: 1.35rem;
        align-items: center;
        justify-content: center;
        gap: clamp(0.6rem, 2.7vw, 0.94rem);
        margin-bottom: clamp(1.55rem, 4.5vh, 2.55rem);
        padding: 0.35rem 0.45rem;
        border-radius: 999px;
        transition: background-color 220ms ease, box-shadow 220ms ease;
      }

      .rose-pin-dot {
        width: clamp(0.62rem, 2.2vw, 0.75rem);
        aspect-ratio: 1;
        border: 1.5px solid rgba(235, 238, 246, 0.76);
        border-radius: 50%;
        box-shadow: inset 0 0 0 0.08rem rgba(8, 5, 13, 0.22);
        transition: transform 210ms cubic-bezier(0.2, 1.25, 0.36, 1), background-color 160ms ease, box-shadow 160ms ease;
      }

      .rose-pin-dot.is-filled {
        border-color: var(--rose-light);
        background: radial-gradient(circle at 34% 28%, #ffe8d1 0 9%, var(--rose-light) 24%, var(--rose) 72%);
        box-shadow:
          0 0 0 0.12rem rgba(200, 42, 69, 0.11),
          0 0 0.75rem rgba(239, 113, 128, 0.48);
        transform: scale(1.12);
      }

      .rose-pin-pad {
        display: grid;
        width: 100%;
        grid-template-columns: repeat(3, 1fr);
        justify-items: center;
        gap: clamp(0.66rem, 2.1vh, 0.98rem) clamp(0.82rem, 4vw, 1.18rem);
      }

      .rose-pin-key {
        display: grid;
        width: clamp(3.65rem, 16vw, 4.7rem);
        aspect-ratio: 1;
        place-items: center;
        border: 1px solid rgba(219, 229, 244, 0.15);
        border-radius: 50%;
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.035)),
          rgba(34, 19, 34, 0.52);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.11),
          0 0.8rem 1.3rem rgba(0, 0, 0, 0.13);
        color: #f6f3f5;
        cursor: pointer;
        font-family: var(--ios);
        font-size: clamp(1.38rem, 5.7vw, 1.76rem);
        font-weight: 400;
        line-height: 1;
        transition: transform 160ms ease, background-color 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      }

      .rose-pin-key:hover,
      .rose-pin-key:focus-visible {
        border-color: rgba(243, 230, 210, 0.64);
        background-color: rgba(93, 34, 56, 0.72);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.16),
          0 0 1.55rem rgba(200, 42, 69, 0.2);
        transform: translateY(-0.12rem);
      }

      .rose-pin-key:active {
        background: rgba(238, 216, 222, 0.28);
        transform: scale(0.91);
        transition-duration: 70ms;
      }

      .rose-pin-key--blank {
        visibility: hidden;
        pointer-events: none;
      }

      .rose-pin-key--delete,
      .rose-pin-key--open {
        background: transparent;
        box-shadow: none;
      }

      .rose-pin-key--delete {
        color: rgba(219, 229, 244, 0.84);
      }

      .rose-pin-key--open {
        border-color: rgba(239, 113, 128, 0.78);
        background: linear-gradient(145deg, #e34e63, #9a1731);
        box-shadow:
          inset 0 1px 0 rgba(255, 239, 224, 0.37),
          0 0.9rem 1.6rem rgba(200, 42, 69, 0.3);
        color: var(--bone);
      }

      .rose-pin-key--open:hover,
      .rose-pin-key--open:focus-visible {
        border-color: var(--bone);
        background: linear-gradient(145deg, #f06c7c, #b51e3c);
      }

      .rose-pin-key svg {
        width: 1.28rem;
        height: 1.28rem;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .rose-pin-key--open svg {
        width: 1.42rem;
        height: 1.42rem;
      }

      .rose-pin-status {
        min-height: 1px;
        margin: 0;
      }

      .rose-pin-form:focus-within .rose-pin-dots {
        background: rgba(219, 229, 244, 0.045);
        box-shadow: 0 0 0 1px rgba(219, 229, 244, 0.15);
      }

      .rose-pin-form.is-unlocking .rose-pin-key--open {
        cursor: wait;
        animation: unlock-pulse 800ms ease-in-out infinite alternate;
      }

      .rose-pin-form.has-error .rose-pin-dots {
        background: rgba(239, 113, 128, 0.09);
        box-shadow: 0 0 0 1px rgba(239, 113, 128, 0.52), 0 0 1.8rem rgba(200, 42, 69, 0.2);
        animation: pin-denied 420ms cubic-bezier(0.36, 0.07, 0.19, 0.97);
      }

      .rose-pin-form.has-error .rose-pin-dot {
        border-color: var(--rose-light);
        background: rgba(239, 113, 128, 0.32);
        box-shadow: 0 0 0.8rem rgba(239, 113, 128, 0.52);
      }

      .rose-gate.is-unlocking .rose-gate-door::before {
        filter: brightness(0.62);
        transform: perspective(36rem) rotateY(-83deg);
      }

      .rose-gate.is-unlocking .rose-gate-door::after {
        filter: brightness(0.62);
        transform: perspective(36rem) rotateY(83deg);
      }

      .rose-gate.is-unlocking .rose-gate-door i {
        opacity: 0;
      }

      .rose-gate.is-unlocking .rose-gate-door b {
        opacity: 1;
      }

      :focus-visible {
        outline: 3px solid #f0ca89;
        outline-offset: 3px;
      }

      @keyframes loading-door {
        from { opacity: 0.36; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1.04); }
      }

      @keyframes star-breathe {
        from { opacity: 0.08; transform: translate3d(0, 0.32rem, 0) scale(0.72); }
        to { opacity: 0.84; transform: translate3d(0, -0.32rem, 0) scale(1); }
      }

      @keyframes pin-denied {
        22% { transform: translateX(-0.44rem); }
        52% { transform: translateX(0.34rem); }
        76% { transform: translateX(-0.18rem); }
      }

      @keyframes unlock-pulse {
        from { box-shadow: inset 0 1px 0 rgba(255, 239, 224, 0.37), 0 0.8rem 1.3rem rgba(200, 42, 69, 0.22); }
        to { box-shadow: inset 0 1px 0 rgba(255, 239, 224, 0.52), 0 0 2.25rem rgba(239, 113, 128, 0.62); }
      }

      @media (max-height: 700px) {
        .rose-gate-moon { top: 1.2rem; width: min(41vh, 15.5rem); }
        .rose-gate-door { top: 3.3rem; width: min(23vh, 8.8rem); }
        .rose-pin-form { margin-top: min(48vh, 17.5rem); }
        .rose-pin-pad { gap: 0.55rem 0.94rem; }
        .rose-pin-key { width: min(11.7vw, 3.72rem); }
      }

      @media (max-width: 390px) {
        .rose-pin-pad { gap: 0.64rem 0.82rem; }
        .rose-pin-key { width: 3.48rem; }
        .rose-pin-dots { gap: 0.52rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="staticrypt_loading" class="rose-gate-loading" role="status">
      <span class="rose-gate-sr">Đang tải cánh cửa…</span>
    </div>

    <main id="staticrypt_content" class="rose-gate hidden">
      <section class="rose-gate-shell" aria-labelledby="rose-gate-title">
        <div class="rose-gate-scene" aria-hidden="true">
          <div class="rose-gate-moon"></div>
          <div class="rose-gate-door"><i></i><b></b></div>
          <div class="rose-gate-dust">
            <i style="--x: 16%; --y: 20%; --s: 2px; --c: #dbe5f4; --d: 3.6s; --delay: -1.2s"></i>
            <i style="--x: 28%; --y: 12%; --s: 3px; --c: #ef7180; --d: 4.2s; --delay: -2.6s"></i>
            <i style="--x: 73%; --y: 17%; --s: 2px; --c: #f0ca89; --d: 3.8s; --delay: -0.8s"></i>
            <i style="--x: 85%; --y: 31%; --s: 2px; --c: #dbe5f4; --d: 4.8s; --delay: -3.4s"></i>
            <i style="--x: 10%; --y: 42%; --s: 2px; --c: #ef7180; --d: 4.4s; --delay: -1.9s"></i>
            <i style="--x: 80%; --y: 50%; --s: 3px; --c: #f0ca89; --d: 5s; --delay: -0.2s"></i>
            <i style="--x: 23%; --y: 62%; --s: 2px; --c: #dbe5f4; --d: 3.9s; --delay: -2.8s"></i>
            <i style="--x: 72%; --y: 69%; --s: 2px; --c: #ef7180; --d: 4.5s; --delay: -1.1s"></i>
          </div>
        </div>

        <h1 id="rose-gate-title" class="rose-gate-sr">/*[|template_title|]*/0</h1>
        <p id="rose-gate-hint" class="rose-gate-sr" style="opacity:0;transition:opacity .5s ease;pointer-events:none;position:absolute">/*[|template_instructions|]*/0. Hint: my birthday.</p>

        <form id="staticrypt-form" class="rose-pin-form" novalidate>
          <label class="rose-gate-sr" for="staticrypt-password">Mật mã số</label>
          <input
            id="staticrypt-password"
            class="rose-pin-input"
            name="rose-door-password"
            type="password"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="8"
            autocomplete="current-password"
            spellcheck="false"
            aria-describedby="staticrypt-status"
            aria-label="/*[|template_placeholder|]*/0"
            required
          />

          <div class="rose-pin-dots" aria-hidden="true">
            <i class="rose-pin-dot"></i><i class="rose-pin-dot"></i>
            <i class="rose-pin-dot"></i><i class="rose-pin-dot"></i>
            <i class="rose-pin-dot"></i><i class="rose-pin-dot"></i>
            <i class="rose-pin-dot"></i><i class="rose-pin-dot"></i>
          </div>

          <div class="rose-pin-pad" role="group" aria-label="Bàn phím số">
            <button class="rose-pin-key" type="button" data-pin="1" aria-label="Số 1">1</button>
            <button class="rose-pin-key" type="button" data-pin="2" aria-label="Số 2">2</button>
            <button class="rose-pin-key" type="button" data-pin="3" aria-label="Số 3">3</button>
            <button class="rose-pin-key" type="button" data-pin="4" aria-label="Số 4">4</button>
            <button class="rose-pin-key" type="button" data-pin="5" aria-label="Số 5">5</button>
            <button class="rose-pin-key" type="button" data-pin="6" aria-label="Số 6">6</button>
            <button class="rose-pin-key" type="button" data-pin="7" aria-label="Số 7">7</button>
            <button class="rose-pin-key" type="button" data-pin="8" aria-label="Số 8">8</button>
            <button class="rose-pin-key" type="button" data-pin="9" aria-label="Số 9">9</button>
            <button class="rose-pin-key rose-pin-key--delete" type="button" data-action="delete" aria-label="Xóa số cuối">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m11 7-5 5 5 5h7a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Zm1 3.2 3.6 3.6m0-3.6L12 13.8" /></svg>
            </button>
            <button class="rose-pin-key" type="button" data-pin="0" aria-label="Số 0">0</button>
            <button class="rose-pin-key rose-pin-key--open staticrypt-decrypt-button" type="submit" aria-label="/*[|template_button|]*/0">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13m-5-5 5 5-5 5" /></svg>
            </button>
          </div>

          <label id="staticrypt-remember-label" class="rose-gate-sr">
            <input id="staticrypt-remember" type="checkbox" />/*[|template_remember|]*/0
          </label>
          <p id="staticrypt-status" class="rose-pin-status rose-gate-sr" role="alert" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script>
      const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
      const templateError = "/*[|template_error|]*/0";
      const isRememberEnabled = /*[|is_remember_enabled|]*/ 0;
      const staticryptConfig = /*[|staticrypt_config|]*/ 0;
      const staticrypt = staticryptInitiator.init(staticryptConfig, {
        rememberExpirationKey: "rose_door_expiration",
        rememberPassphraseKey: "rose_door_passphrase",
        replaceHtmlCallback: null,
        clearLocalStorageCallback: null
      });

      const loading = document.getElementById("staticrypt_loading");
      const content = document.getElementById("staticrypt_content");
      const form = document.getElementById("staticrypt-form");
      const input = document.getElementById("staticrypt-password");
      const remember = document.getElementById("staticrypt-remember");
      const status = document.getElementById("staticrypt-status");
      const decryptButton = document.querySelector(".staticrypt-decrypt-button");
      const pinDots = Array.from(document.querySelectorAll(".rose-pin-dot"));
      const pinButtons = Array.from(document.querySelectorAll("[data-pin]"));
      const deleteButton = document.querySelector('[data-action="delete"]');
      const secureContextError = "Cánh cửa chỉ mở trên HTTPS hoặc http://localhost.";
      const hintEl = document.getElementById("rose-gate-hint");
      let failureTimer;
      let hasFailedOnce = false;

      // Prime a silent Web Audio context inside the PIN gesture. Staticrypt
      // replaces this document after an async decrypt, which is too late to
      // satisfy browser autoplay policy on its own. The decrypted Rose Door
      // adopts this same context and starts its default-on score seamlessly.
      function primeRoseAudio() {
        try {
          if (window.sessionStorage.getItem("rose-door-sound") === "off") return;
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          if (!window.__roseDoorAudioContext || window.__roseDoorAudioContext.state === "closed") {
            window.__roseDoorAudioContext = new AudioContextClass({ latencyHint: "interactive" });
          }
          if (window.__roseDoorAudioContext.state === "suspended") {
            void window.__roseDoorAudioContext.resume().catch(() => undefined);
          }
        } catch (_) {
          // Audio is decorative; password entry must never depend on it.
        }
      }

      document.addEventListener("pointerdown", primeRoseAudio, { capture: true, once: true });
      document.addEventListener("keydown", primeRoseAudio, { capture: true, once: true });

      function canUseWebCrypto() {
        return Boolean(window.isSecureContext && window.crypto && window.crypto.subtle);
      }

      function revealGate() {
        loading.classList.add("hidden");
        content.classList.remove("hidden");
        remember.checked = false;
        remember.disabled = !isRememberEnabled;
      }

      function normalisePin(value) {
        return value.replace(/\D/g, "").slice(0, pinDots.length);
      }

      function updatePinDots() {
        const length = input.value.length;
        pinDots.forEach((dot, index) => {
          dot.classList.toggle("is-filled", index < Math.min(length, pinDots.length));
        });
      }

      function clearFailure() {
        window.clearTimeout(failureTimer);
        form.classList.remove("has-error");
        input.removeAttribute("aria-invalid");
        status.textContent = "";
      }

      function resetButton() {
        decryptButton.disabled = false;
        decryptButton.removeAttribute("aria-busy");
        form.classList.remove("is-unlocking");
        content.classList.remove("is-unlocking");
      }

      function showFailure(message, shouldClear = false) {
        resetButton();
        form.classList.add("has-error");
        input.setAttribute("aria-invalid", "true");
        status.textContent = message;
        window.clearTimeout(failureTimer);
        failureTimer = window.setTimeout(() => {
          form.classList.remove("has-error");
          input.removeAttribute("aria-invalid");
          if (shouldClear) {
            input.value = "";
            updatePinDots();
          }
        }, 640);
      }

      function focusPin() {
        input.focus({ preventScroll: true });
      }

      function appendDigit(digit) {
        if (decryptButton.disabled) return;
        clearFailure();
        input.value = normalisePin(`${input.value}${digit}`);
        updatePinDots();
        focusPin();
      }

      function deleteDigit() {
        if (decryptButton.disabled) return;
        clearFailure();
        input.value = input.value.slice(0, -1);
        updatePinDots();
        focusPin();
      }

      window.onload = async function () {
        if (!canUseWebCrypto()) {
          revealGate();
          showFailure(secureContextError);
          return;
        }

        try {
          const result = await staticrypt.handleDecryptOnLoad();
          if (result.isSuccessful) return;
          revealGate();
          if (window.matchMedia("(pointer: fine) and (min-width: 721px)").matches) focusPin();
        } catch (_) {
          revealGate();
          showFailure("Không thể khởi tạo cánh cửa. Hãy tải lại trang và thử lại.");
        }
      };

      pinButtons.forEach((button) => {
        button.addEventListener("click", () => appendDigit(button.dataset.pin));
      });
      deleteButton.addEventListener("click", deleteDigit);

      input.addEventListener("input", function () {
        const cleanValue = normalisePin(input.value);
        if (input.value !== cleanValue) input.value = cleanValue;
        if (!canUseWebCrypto()) {
          showFailure(secureContextError);
          return;
        }
        clearFailure();
        updatePinDots();
      });

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (!canUseWebCrypto()) {
          showFailure(secureContextError);
          return;
        }
        if (!input.value) {
          showFailure("Hãy nhập mật mã trước khi mở cánh cửa.");
          focusPin();
          return;
        }

        clearFailure();
        decryptButton.disabled = true;
        decryptButton.setAttribute("aria-busy", "true");
        form.classList.add("is-unlocking");
        content.classList.add("is-unlocking");
        status.textContent = "Đang kiểm tra mật mã…";

        try {
          const result = await staticrypt.handleDecryptionOfPage(input.value, remember.checked);
          if (!result.isSuccessful) {
            showFailure(templateError, true);
            if (!hasFailedOnce && hintEl) {
              hasFailedOnce = true;
              hintEl.style.position = "relative";
              hintEl.style.opacity = "1";
              hintEl.style.pointerEvents = "auto";
            }
          }
        } catch (_) {
          showFailure(
            canUseWebCrypto()
              ? "Cánh cửa không mở được. Hãy tải lại trang và thử lại."
              : secureContextError
          );
        }
      });
    </script>
  </body>
</html>
