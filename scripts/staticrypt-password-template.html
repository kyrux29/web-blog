<!doctype html>
<html class="staticrypt-html" lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d090b" />
    <title>/*[|template_title|]*/0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #0d090b;
        --paper-raised: #191014;
        --ink: #f7f0ee;
        --ink-soft: #c5b7b8;
        --wine: #260812;
        --plum: #661326;
        --signal: #d42a46;
        --signal-dark: #f2777f;
        --signal-ink: #fffaf6;
        --moon: #d3dae3;
        --line: rgba(247, 240, 238, 0.15);
        --display: "Bricolage Grotesque", "Arial Narrow", sans-serif;
        --brand: "Unbounded", "Bricolage Grotesque", sans-serif;
        --body: "IBM Plex Sans", system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      html {
        background: var(--paper);
        color-scheme: dark;
      }

      body.staticrypt-body {
        min-width: 320px;
        min-height: 100svh;
        margin: 0;
        overflow-x: clip;
        background-color: var(--paper);
        background-image:
          radial-gradient(circle, rgba(238, 97, 112, 0.1) 0 1px, transparent 1.2px),
          linear-gradient(
            90deg,
            transparent calc(50% - 1px),
            rgba(212, 42, 70, 0.055) 50%,
            transparent calc(50% + 1px)
          );
        background-size: 22px 22px, 100% 100%;
        color: var(--ink);
        font-family: var(--body);
        -webkit-font-smoothing: antialiased;
      }

      button,
      input {
        font: inherit;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      .hidden {
        display: none !important;
      }

      .staticrypt-loading {
        position: fixed;
        z-index: 10;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--paper);
      }

      .spinner {
        width: 2.6rem;
        aspect-ratio: 1;
        border: 4px solid rgba(247, 240, 238, 0.14);
        border-top-color: var(--signal);
        border-radius: 50%;
        animation: spin 700ms linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(1turn);
        }
      }

      .vault-wrap {
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: clamp(1rem, 4vw, 3rem);
      }

      .vault-shell {
        position: relative;
        display: grid;
        width: min(100%, 62rem);
        min-height: 36rem;
        grid-template-columns: minmax(18rem, 0.82fr) minmax(22rem, 1.18fr);
        overflow: hidden;
        border: 1px solid var(--line);
        background: var(--paper-raised);
        box-shadow:
          12px 12px 0 rgba(102, 19, 38, 0.3),
          24px 24px 0 rgba(212, 42, 70, 0.08);
      }

      .vault-shell::before {
        content: "";
        position: absolute;
        z-index: 3;
        top: 0;
        right: 0;
        width: 2rem;
        height: 2rem;
        background: var(--signal);
        clip-path: polygon(0 0, 100% 100%, 0 100%);
      }

      .vault-art {
        position: relative;
        display: flex;
        min-height: 36rem;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        background:
          linear-gradient(150deg, rgba(102, 19, 38, 0.42), transparent 45%),
          var(--wine);
        color: #fffdfa;
        padding: clamp(1.5rem, 4vw, 3rem);
        isolation: isolate;
      }

      .vault-art::before {
        content: "";
        position: absolute;
        z-index: -1;
        right: -34%;
        bottom: -24%;
        width: 26rem;
        aspect-ratio: 1;
        border: 1px solid rgba(220, 231, 244, 0.2);
        border-radius: 50%;
        box-shadow: 0 0 0 1rem rgba(220, 231, 244, 0.035);
      }

      .vault-eyebrow {
        margin: 0;
        color: var(--moon);
        font-family: var(--mono);
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .gate-mark {
        position: relative;
        display: grid;
        width: min(100%, 18rem);
        aspect-ratio: 1.22;
        place-items: center;
        align-self: center;
      }

      .gate-mark::before {
        content: "";
        position: absolute;
        z-index: -1;
        width: 38%;
        height: 62%;
        border: 4px solid var(--signal);
        border-bottom: 0;
        background: linear-gradient(180deg, #9f3547, var(--signal) 66%, var(--plum));
        clip-path: polygon(18% 0, 82% 0, 100% 14%, 100% 100%, 0 100%, 0 14%);
        box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.24);
      }

      .gate-bat {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        fill: #080406;
        stroke: rgba(238, 97, 112, 0.72);
        stroke-width: 0.7;
        filter: drop-shadow(0 0.8rem 1rem rgba(0, 0, 0, 0.28));
      }

      .gate-k {
        position: relative;
        display: grid;
        width: 4.25rem;
        aspect-ratio: 1;
        place-items: center;
        border: 2px solid var(--moon);
        background: var(--wine);
        color: var(--signal-dark);
        font-family: var(--brand);
        font-size: 1.6rem;
        font-weight: 800;
        transform: rotate(45deg);
      }

      .gate-k span {
        transform: rotate(-45deg);
      }

      .vault-art-copy {
        max-width: 20rem;
      }

      .vault-art-copy strong {
        display: block;
        font-family: var(--display);
        font-size: clamp(2.2rem, 5vw, 4.2rem);
        font-weight: 800;
        letter-spacing: -0.065em;
        line-height: 0.84;
        text-transform: uppercase;
      }

      .vault-art-copy p {
        margin: 0.85rem 0 0;
        color: rgba(220, 231, 244, 0.78);
        font-size: 0.92rem;
        line-height: 1.55;
      }

      .vault-panel {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: clamp(1.6rem, 5vw, 4.5rem);
      }

      .vault-brand {
        display: inline-flex;
        width: max-content;
        align-items: center;
        gap: 0.65rem;
        margin-bottom: 2.2rem;
        background: var(--signal);
        color: var(--signal-ink);
        padding: 0.62rem 0.9rem 0.68rem;
        font-family: var(--brand);
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        clip-path: polygon(0.5rem 0, 100% 0, calc(100% - 0.5rem) 100%, 0 100%);
      }

      h1.staticrypt-title {
        max-width: 28rem;
        margin: 0;
        color: var(--ink);
        font-family: var(--display);
        font-size: clamp(2.5rem, 5.8vw, 4.7rem);
        font-weight: 800;
        letter-spacing: -0.065em;
        line-height: 0.9;
        text-wrap: balance;
      }

      .staticrypt-instructions {
        max-width: 31rem;
        margin: 1.2rem 0 0;
        color: var(--ink-soft);
        font-size: 1rem;
        line-height: 1.65;
      }

      form.staticrypt-form {
        display: grid;
        gap: 0.9rem;
        margin-top: 2rem;
      }

      .field-label {
        color: var(--signal-dark);
        font-family: var(--mono);
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .field {
        display: grid;
        min-height: 3.7rem;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        border: 1px solid var(--line);
        border-left: 4px solid var(--signal);
        background: #120c0f;
        box-shadow: 4px 4px 0 rgba(102, 19, 38, 0.24);
      }

      .field:focus-within {
        border-color: var(--signal);
        box-shadow: 5px 5px 0 rgba(212, 42, 70, 0.22);
      }

      .prompt {
        padding-left: 1rem;
        color: var(--signal-dark);
        font-family: var(--mono);
        font-weight: 600;
      }

      input#staticrypt-password {
        width: 100%;
        min-height: 3.5rem;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        padding: 0 0.8rem;
        font-family: var(--mono);
        font-size: 0.95rem;
      }

      input#staticrypt-password::placeholder {
        color: rgba(197, 183, 184, 0.62);
      }

      .toggle {
        min-width: 4.3rem;
        min-height: 2.7rem;
        margin-right: 0.45rem;
        border: 0;
        background: transparent;
        color: var(--ink-soft);
        font-family: var(--mono);
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        cursor: pointer;
      }

      .toggle:hover,
      .toggle:focus-visible {
        color: var(--signal-dark);
      }

      button.staticrypt-decrypt-button {
        min-height: 3.6rem;
        border: 0;
        background: var(--signal);
        color: var(--signal-ink);
        padding: 0.9rem 1.2rem;
        font-family: var(--brand);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        clip-path: polygon(0 0, calc(100% - 0.8rem) 0, 100% 50%, calc(100% - 0.8rem) 100%, 0 100%);
        transition: background-color 140ms ease, transform 140ms ease;
      }

      button.staticrypt-decrypt-button:hover,
      button.staticrypt-decrypt-button:focus-visible {
        background: var(--moon);
        color: #211416;
        transform: translateX(0.2rem);
      }

      button.staticrypt-decrypt-button:disabled {
        cursor: wait;
        opacity: 0.68;
      }

      label.staticrypt-remember {
        display: flex;
        min-height: 2.75rem;
        align-items: center;
        gap: 0.65rem;
        color: var(--ink-soft);
        font-size: 0.84rem;
        cursor: pointer;
      }

      label.staticrypt-remember input[type="checkbox"] {
        width: 1.15rem;
        height: 1.15rem;
        accent-color: var(--signal-dark);
      }

      .form-status {
        min-height: 1.4rem;
        margin: 0;
        color: var(--signal-dark);
        font-size: 0.84rem;
        font-weight: 600;
      }

      .staticrypt-form.has-error .field {
        animation: gate-denied 260ms ease;
        border-color: var(--signal-dark);
      }

      @keyframes gate-denied {
        35% {
          transform: translateX(-0.3rem);
        }
        70% {
          transform: translateX(0.3rem);
        }
      }

      .vault-back {
        width: max-content;
        margin-top: 1.5rem;
        color: var(--ink-soft);
        font-family: var(--mono);
        font-size: 0.76rem;
        text-decoration: none;
      }

      .vault-back:hover,
      .vault-back:focus-visible {
        color: var(--signal-dark);
        text-decoration: underline;
        text-underline-offset: 0.25rem;
      }

      :focus-visible {
        outline: 3px solid var(--signal-dark);
        outline-offset: 3px;
      }

      @media (max-width: 760px) {
        .vault-wrap {
          align-items: start;
          padding: 0;
        }

        .vault-shell {
          min-height: 100svh;
          grid-template-columns: 1fr;
          box-shadow: none;
        }

        .vault-art {
          min-height: 12rem;
          display: grid;
          grid-template-columns: minmax(0, 1fr) 8.5rem;
          align-items: center;
          gap: 1rem;
          padding: 1.25rem;
        }

        .vault-eyebrow {
          grid-column: 1;
        }

        .gate-mark {
          width: 8.5rem;
          grid-column: 2;
          grid-row: 1 / span 2;
        }

        .gate-k {
          width: 2.8rem;
          font-size: 1rem;
        }

        .vault-art-copy {
          grid-column: 1;
        }

        .vault-art-copy strong {
          font-size: clamp(2.25rem, 12vw, 3.4rem);
        }

        .vault-art-copy p {
          display: none;
        }

        .vault-panel {
          justify-content: start;
          padding: clamp(1.4rem, 7vw, 2.5rem);
        }

        .vault-brand {
          margin-bottom: 1.5rem;
        }

        h1.staticrypt-title {
          font-size: clamp(2.45rem, 13vw, 4.1rem);
        }
      }

      @media (max-width: 420px) {
        .vault-art {
          min-height: 10rem;
          grid-template-columns: minmax(0, 1fr) 6.5rem;
        }

        .gate-mark {
          width: 6.5rem;
        }

        .vault-panel {
          padding: 1.35rem 1rem 2rem;
        }

        .staticrypt-instructions {
          font-size: 0.94rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>

  <body class="staticrypt-body">
    <div id="staticrypt_loading" class="staticrypt-loading">
      <div class="spinner" aria-label="Đang tải cổng mã hóa"></div>
    </div>

    <main id="staticrypt_content" class="vault-wrap hidden">
      <section class="vault-shell" aria-labelledby="vault-title">
        <div class="vault-art" aria-hidden="true">
          <p class="vault-eyebrow">KYRUX // ENCRYPTED NOTE</p>
          <div class="gate-mark">
            <svg class="gate-bat" viewBox="0 0 64 32" role="presentation">
              <path d="M32 14C27 8 21 5 13 5c3 3 4 6 3 10-4-3-8-3-12-1 5 3 8 7 10 13 6-2 11-5 18-9 7 4 12 7 18 9 2-6 5-10 10-13-4-2-8-2-12 1-1-4 0-7 3-10-8 0-14 3-19 9Z" />
            </svg>
            <span class="gate-k"><span>K</span></span>
          </div>
          <div class="vault-art-copy">
            <strong>Batwing<br />Vault</strong>
            <p>Cánh cửa chỉ mở khi passphrase khớp với khóa của bài viết.</p>
          </div>
        </div>

        <div class="vault-panel">
          <span class="vault-brand">KYRUX</span>
          <h1 id="vault-title" class="staticrypt-title">/*[|template_title|]*/0</h1>
          <p class="staticrypt-instructions">/*[|template_instructions|]*/0</p>

          <form id="staticrypt-form" class="staticrypt-form" novalidate>
            <label class="field-label" for="staticrypt-password">Passphrase</label>
            <div class="field">
              <span class="prompt" aria-hidden="true">&gt;</span>
              <input
                id="staticrypt-password"
                type="password"
                autocomplete="current-password"
                placeholder="/*[|template_placeholder|]*/0"
                aria-describedby="staticrypt-status"
                required
              />
              <button
                id="staticrypt-toggle"
                class="toggle staticrypt-toggle-password-visibility"
                type="button"
              >
                HIỆN
              </button>
            </div>

            <label id="staticrypt-remember-label" class="staticrypt-remember hidden">
              <input id="staticrypt-remember" type="checkbox" />
              <span>/*[|template_remember|]*/0</span>
            </label>

            <p id="staticrypt-status" class="form-status" role="alert" aria-live="polite"></p>
            <button class="staticrypt-decrypt-button" type="submit">/*[|template_button|]*/0</button>
          </form>

          <a class="vault-back" href="/">← Quay lại Kyrux Blog</a>
        </div>
      </section>
    </main>

    <script>
      const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
      const templateError = "/*[|template_error|]*/0",
        templateToggleAltShow = "/*[|template_toggle_show|]*/0",
        templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
        isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
        staticryptConfig = /*[|staticrypt_config|]*/ 0;

      const templateConfig = {
        rememberExpirationKey: "staticrypt_expiration",
        rememberPassphraseKey: "staticrypt_passphrase",
        replaceHtmlCallback: null,
        clearLocalStorageCallback: null
      };

      const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);
      const loading = document.getElementById("staticrypt_loading");
      const content = document.getElementById("staticrypt_content");
      const form = document.getElementById("staticrypt-form");
      const input = document.getElementById("staticrypt-password");
      const remember = document.getElementById("staticrypt-remember");
      const rememberLabel = document.getElementById("staticrypt-remember-label");
      const toggle = document.getElementById("staticrypt-toggle");
      const status = document.getElementById("staticrypt-status");
      const decryptButton = document.querySelector(".staticrypt-decrypt-button");
      const defaultButtonText = decryptButton.textContent;
      const secureContextError =
        "Trình duyệt chỉ có thể mở khóa trên HTTPS hoặc http://localhost. Hãy đổi sang một trong hai địa chỉ này.";

      function canUseWebCrypto() {
        return Boolean(window.isSecureContext && window.crypto && window.crypto.subtle);
      }

      function revealGate() {
        loading.classList.add("hidden");
        content.classList.remove("hidden");
        if (isRememberEnabled) rememberLabel.classList.remove("hidden");
      }

      function resetDecryptButton() {
        decryptButton.disabled = false;
        decryptButton.textContent = defaultButtonText;
      }

      function showFailure(message) {
        form.classList.add("has-error");
        input.setAttribute("aria-invalid", "true");
        status.textContent = message;
        resetDecryptButton();
      }

      window.onload = async function () {
        if (!canUseWebCrypto()) {
          revealGate();
          showFailure(secureContextError);
          return;
        }

        try {
          const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
          if (isSuccessful) return;
          revealGate();
          input.focus();
        } catch (_) {
          revealGate();
          showFailure("Không thể khởi tạo cổng giải mã. Hãy tải lại trang và thử lại.");
        }
      };

      toggle.setAttribute("aria-label", templateToggleAltShow);
      toggle.title = templateToggleAltShow;
      toggle.addEventListener("click", function () {
        const showing = input.type === "text";
        input.type = showing ? "password" : "text";
        toggle.textContent = showing ? "HIỆN" : "ẨN";
        toggle.setAttribute("aria-label", showing ? templateToggleAltShow : templateToggleAltHide);
        toggle.title = showing ? templateToggleAltShow : templateToggleAltHide;
        input.focus();
      });

      input.addEventListener("input", function () {
        if (!canUseWebCrypto()) {
          showFailure(secureContextError);
          return;
        }
        form.classList.remove("has-error");
        input.removeAttribute("aria-invalid");
        status.textContent = "";
      });

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (!canUseWebCrypto()) {
          showFailure(secureContextError);
          return;
        }
        if (!input.value) {
          status.textContent = "Hãy nhập passphrase trước khi mở cửa.";
          input.setAttribute("aria-invalid", "true");
          input.focus();
          return;
        }

        form.classList.remove("has-error");
        status.textContent = "Đang kiểm tra khóa…";
        decryptButton.disabled = true;
        decryptButton.textContent = "ĐANG MỞ…";

        let isSuccessful = false;
        try {
          const result = await staticrypt.handleDecryptionOfPage(
            input.value,
            remember.checked
          );
          isSuccessful = result.isSuccessful;
        } catch (_) {
          showFailure(
            canUseWebCrypto()
              ? "Không thể giải mã nội dung. Hãy tải lại trang và thử lại."
              : secureContextError
          );
          return;
        }

        if (!isSuccessful) {
          showFailure(templateError);
          input.select();
        }
      });
    </script>
  </body>
</html>
