<!doctype html>
<html class="staticrypt-html" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>/*[|template_title|]*/0</title>
    <style>
      :root {
        --bg: #020617;
        --panel: rgba(15, 23, 42, 0.72);
        --border: rgba(51, 65, 85, 0.9);
        --text: #e2e8f0;
        --muted: rgba(148, 163, 184, 0.9);
        --accent: #22d3ee;
        --accent2: #06b6d4;
        --danger: #fb7185;
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
        --radius: 18px;
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New",
          monospace;
        --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial,
          "Noto Sans", "Liberation Sans", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body.staticrypt-body {
        margin: 0;
        color: var(--text);
        background: radial-gradient(circle at 50% -30%, rgba(30, 41, 59, 0.5), transparent 45%), var(--bg);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        color: var(--accent2);
      }

      .hidden {
        display: none !important;
      }

      .staticrypt-loading {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .spinner {
        width: 36px;
        height: 36px;
        border: 4px solid rgba(148, 163, 184, 0.35);
        border-right-color: transparent;
        border-radius: 999px;
        animation: spin 0.75s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .wrap {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .panel {
        width: 100%;
        max-width: 520px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--panel);
        backdrop-filter: blur(10px);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 18px;
        border-bottom: 1px solid rgba(51, 65, 85, 0.8);
        font-family: var(--mono);
        color: rgba(148, 163, 184, 0.95);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(51, 65, 85, 0.8);
        background: rgba(2, 6, 23, 0.55);
        color: rgba(226, 232, 240, 0.92);
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 0 6px rgba(34, 211, 238, 0.08);
      }

      .panel-body {
        padding: 18px;
      }

      h1.staticrypt-title {
        margin: 4px 0 6px;
        font-size: 22px;
        line-height: 1.25;
        letter-spacing: -0.02em;
      }

      .staticrypt-instructions {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      form.staticrypt-form {
        display: grid;
        gap: 12px;
        margin: 0;
      }

      .field {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 12px;
        border-radius: 14px;
        border: 1px solid rgba(51, 65, 85, 0.85);
        background: rgba(2, 6, 23, 0.35);
      }

      .prompt {
        font-family: var(--mono);
        color: rgba(34, 211, 238, 0.92);
        font-size: 14px;
        user-select: none;
      }

      input#staticrypt-password {
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: rgba(226, 232, 240, 0.98);
        font-family: var(--mono);
        font-size: 14px;
        padding: 2px 34px 2px 0;
      }

      input#staticrypt-password::placeholder {
        color: rgba(148, 163, 184, 0.7);
      }

      .toggle {
        cursor: pointer;
        height: 20px;
        width: 20px;
        opacity: 0.75;
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        user-select: none;
      }

      .toggle:hover {
        opacity: 0.95;
      }

      button.staticrypt-decrypt-button {
        width: 100%;
        border: 1px solid rgba(34, 211, 238, 0.35);
        border-radius: 14px;
        background: rgba(8, 145, 178, 0.18);
        color: rgba(226, 232, 240, 0.96);
        padding: 12px 14px;
        font-weight: 650;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
      }

      button.staticrypt-decrypt-button:hover {
        border-color: rgba(34, 211, 238, 0.7);
        background: rgba(8, 145, 178, 0.28);
      }

      button.staticrypt-decrypt-button:active {
        transform: translateY(1px);
      }

      label.staticrypt-remember {
        display: flex;
        align-items: center;
        gap: 10px;
        color: rgba(148, 163, 184, 0.95);
        font-size: 13px;
        user-select: none;
      }

      label.staticrypt-remember input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
      }

      .hint {
        margin-top: 10px;
        padding-top: 12px;
        border-top: 1px solid rgba(51, 65, 85, 0.6);
        color: rgba(148, 163, 184, 0.85);
        font-size: 12px;
        line-height: 1.55;
      }

      .hint b {
        color: rgba(226, 232, 240, 0.92);
        font-weight: 650;
      }

      .hint code {
        font-family: var(--mono);
        color: rgba(34, 211, 238, 0.92);
      }

      @media (max-width: 420px) {
        .panel-body {
          padding: 16px;
        }
        h1.staticrypt-title {
          font-size: 20px;
        }
      }
    </style>
  </head>

  <body class="staticrypt-body">
    <div id="staticrypt_loading" class="staticrypt-loading">
      <div class="spinner" aria-label="Loading"></div>
    </div>

    <div id="staticrypt_content" class="wrap hidden">
      <div class="panel">
        <div class="panel-header">
          <span class="badge"><span class="dot"></span> KYRUX_LABS</span>
          <span>kyrux@labs:~/protected</span>
        </div>
        <div class="panel-body">
          <h1 class="staticrypt-title">/*[|template_title|]*/0</h1>
          <p class="staticrypt-instructions">/*[|template_instructions|]*/0</p>

          <form id="staticrypt-form" class="staticrypt-form">
            <div class="field">
              <span class="prompt">$</span>
              <input
                id="staticrypt-password"
                type="password"
                autocomplete="current-password"
                placeholder="/*[|template_placeholder|]*/0"
                aria-label="Password"
              />
              <img class="toggle staticrypt-toggle-password-visibility" alt="toggle" />
            </div>

            <label id="staticrypt-remember-label" class="staticrypt-remember hidden">
              <input id="staticrypt-remember" type="checkbox" />
              <span>/*[|template_remember|]*/0</span>
            </label>

            <button class="staticrypt-decrypt-button" type="submit">/*[|template_button|]*/0</button>
          </form>

          <div class="hint">
            <b>Tip:</b> dùng passphrase dài (16+ ký tự). Nếu bạn có link share, có thể có dạng
            <code>#staticrypt_pwd=...</code>.
          </div>
        </div>
      </div>
    </div>

    <script>
      // these variables will be filled when generating the file - the template format is '/*[|variable_name|]*/0'
      const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
      const templateError = "/*[|template_error|]*/0",
        templateToggleAltShow = "/*[|template_toggle_show|]*/0",
        templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
        isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
        staticryptConfig = /*[|staticrypt_config|]*/ 0;

      // you can edit these values to customize some of the behavior of StatiCrypt
      const templateConfig = {
        rememberExpirationKey: "staticrypt_expiration",
        rememberPassphraseKey: "staticrypt_passphrase",
        replaceHtmlCallback: null,
        clearLocalStorageCallback: null
      };

      // init the staticrypt engine
      const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

      // try to automatically decrypt on load if there is a saved password
      window.onload = async function () {
        const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

        // if we didn't decrypt anything on load, show the password prompt.
        if (!isSuccessful) {
          // hide loading screen
          document.getElementById("staticrypt_loading").classList.add("hidden");
          document.getElementById("staticrypt_content").classList.remove("hidden");
          document.getElementById("staticrypt-password").focus();

          // show the remember me checkbox
          if (isRememberEnabled) {
            document.getElementById("staticrypt-remember-label").classList.remove("hidden");

      const imgSrcEyeOpened =
        "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1NzYgNTEyIj48IS0tIUZvbnQgQXdlc29tZSBGcmVlIDYuNS4yIGJ5IEBmb250YXdlc29tZSAtIGh0dHBzOi8vZm9udGF3ZXNvbWUuY29tIExpY2Vuc2UgLSBodHRwczovL2ZvbnRhd2Vzb21lLmNvbS9saWNlbnNlL2ZyZWUgQ29weXJpZ2h0IDIwMjQgRm9udGljb25zLCBJbmMuLS0+PHBhdGggZD0iTTI4OCAzMmMtODAuOCAwLTE0NS41IDM2LjgtMTkyLjYgODAuNkM0OC42IDE1NiAxNy4zIDIwOCAyLjUgMjQzLjdjLTMuMyA3LjktMy4zIDE2LjcgMCAyNC42QzE3LjMgMzA0IDQ4LjYgMzU2IDk1LjQgMzk5LjRDMTQyLjUgNDQzLjIgMjA3LjIgNDgwIDI4OCA0ODBzMTQ1LjUtMzYuOCAxOTIuNi04MC42YzQ2LjgtNDMuNSA3OC4xLTk1LjQgOTMtMTMxLjFjMy4zLTcuOSAzLjMtMTYuNyAwLTI0LjZjLTE0LjktMzUuNy00Ni4yLTg3LjctOTMtMTMxLjFDNDMzLjUgNjguOCAzNjguOCAzMiAyODggMzJ6TTE0NCAyNTZhMTQ0IDE0NCAwIDEgMSAyODggMCAxNDQgMTQ0IDAgMSAxIC0yODggMHptMTQ0LTY0YzAgMzUuMy0yOC43IDY0LTY0IDY0Yy03LjEgMC0xMy45LTEuMi0yMC4zLTMuM2MtNS41LTEuOC0xMS45IDEuNi0xMS43IDcuNGMuMyA2LjkgMS4zIDEzLjggMy4yIDIwLjdjMTMuNyA1MS4yIDY2LjQgODEuNiAxMTcuNiA2Ny45czgxLjYtNjYuNCA2Ny45LTExNy42Yy0xMS4xLTQxLjUtNDcuOC02OS40LTg4LjYtNzEuMWMtNS44LS4yLTkuMiA2LjEtNy40IDExLjdjMi4xIDYuNCAzLjMgMTMuMiAzLjMgMjAuM3oiLz48L3N2Zz4=";

      toggleIcon.src = imgSrcEyeClosed;
      toggleIcon.alt = templateToggleAltShow;
      toggleIcon.title = templateToggleAltShow;

      toggleIcon.addEventListener("click", function () {
        const passwordInput = document.getElementById("staticrypt-password");
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          toggleIcon.src = imgSrcEyeOpened;
          toggleIcon.alt = templateToggleAltHide;
          toggleIcon.title = templateToggleAltHide;
        } else {
          passwordInput.type = "password";
          toggleIcon.src = imgSrcEyeClosed;
          toggleIcon.alt = templateToggleAltShow;
          toggleIcon.title = templateToggleAltShow;
        }
      });

      // handle password form submission
      document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
        e.preventDefault();

        const password = document.getElementById("staticrypt-password").value,
          isRememberChecked = document.getElementById("staticrypt-remember").checked;

        const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

        if (!isSuccessful) {
          alert(templateError);
        }
      });
    </script>
  </body>
</html>
