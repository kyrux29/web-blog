name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://kyrux.xyz
      BASE_PATH: /
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm approve-builds --all

      - name: Verify toolchain
        run: |
          node -v
          pnpm -v
          pnpm exec astro --version

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run check

      - name: Verify protected-post passphrase
        if: github.event_name != 'pull_request'
        env:
          KYRUX_POST_PASSWORD: ${{ secrets.KYRUX_POST_PASSWORD }}
        run: |
          if [ -z "$KYRUX_POST_PASSWORD" ]; then
            echo "::error::Missing repository secret KYRUX_POST_PASSWORD"
            exit 1
          fi

      - name: Build site
        run: pnpm run build
        env:
          KYRUX_POST_PASSWORD: ${{ github.event_name == 'pull_request' && 'preview-build-only-passphrase' || secrets.KYRUX_POST_PASSWORD }}

      - name: Verify dist output
        run: |
          test -d dist
          ls -la dist

      - name: Internal link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --no-progress
            --base dist/
            --scheme http,https
            --include 'dist/**/*.html'
            --exclude 'mailto:'
            --max-concurrency 8
            dist/
          fail: true
        continue-on-error: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
